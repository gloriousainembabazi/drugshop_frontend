name: his_grace_drugshop
description: His Grace Drugshop Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  animations: ^2.0.8

  # State Management
  provider: ^6.1.1

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Image Picker
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  share_plus: ^9.0.0


  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Utilities
  url_launcher: ^6.2.2
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/icons/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
